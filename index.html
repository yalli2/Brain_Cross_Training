<title>브레인 크로스트레이닝</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* Layout: 좌측 챕터 내비게이션 + 본문(원리 → 활동 → 함께 보는 결과). 모바일에서는 내비가 가로 스트립으로 접힌다. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#16212c; --muted:#5b6874; --line:#dde3ea; --soft:#eaeff5;
  --grp:#2a78d6; --me:#eb6834; --good:#1a7f4b; --warn:#b36b00;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --font-body:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Noto Serif KR","Noto Sans KR",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171d; --surface:#192129; --ink:#e8edf2; --muted:#9aa8b4; --line:#2b3641; --soft:#222c36;
  --grp:#3987e5; --me:#f0814f; --good:#4cc38a; --warn:#e0a040;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171d; --surface:#192129; --ink:#e8edf2; --muted:#9aa8b4; --line:#2b3641; --soft:#222c36;
  --grp:#3987e5; --me:#f0814f; --good:#4cc38a; --warn:#e0a040;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.3}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:18px 0 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--font-display);font-size:20px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input[type=text],.tools select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;width:130px;font-size:13px}
.tools select{width:auto;max-width:160px}
.live{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%,100%{box-shadow:0 0 0 8px transparent}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}*{transition:none!important}}
.demo{font-size:12px;display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
.banner{margin:12px 0 0;padding:9px 14px;border-radius:8px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));font-size:13px}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;padding-top:22px}
nav.chs{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 32px);overflow:auto}
nav.chs button{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--muted);font-size:14px}
nav.chs button:hover{background:var(--soft)}
nav.chs button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--me),0 0 0 1px var(--line)}
nav.chs .no{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
nav.chs .ck{font-size:12px;color:var(--good);font-weight:700}
nav.chs .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.sep{height:1px;background:var(--line);margin:6px 8px}
main{min-width:0;display:flex;flex-direction:column;gap:22px}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chead h2{font-size:28px;margin-top:4px}
.chead .en{font-size:13px;color:var(--muted);margin-top:2px}
.chead .principle{margin-top:12px;font-family:var(--font-display);font-size:17px;max-width:62ch}
.sum{max-width:66ch;color:var(--ink)}
.sum ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
.hr{font-size:13px;color:var(--muted);margin-top:8px;max-width:66ch}
.hr b{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.card h3{font-size:17px}
.card .sub{font-size:13px;color:var(--muted);margin-top:2px}
.act h3{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge{font-family:var(--font-body);font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.badge.ok{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--good)}
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q p{margin-bottom:8px;font-size:14.5px}
.scale,.opts{display:flex;flex-wrap:wrap;gap:6px}
.scale label,.opts label{position:relative}
.scale input,.opts input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.scale span,.opts span{display:inline-flex;justify-content:center;align-items:center;min-width:42px;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;font-size:14px;font-variant-numeric:tabular-nums}
.opts span{height:auto;min-height:38px;padding:6px 12px;text-align:left}
.scale input:checked+span,.opts input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scale input:focus-visible+span,.opts input:focus-visible+span,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--grp);outline-offset:2px}
.lg{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);max-width:340px;margin:2px 0 6px}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ab .opts span{width:100%}
.ab .opts{display:block}
.ab .opts label{display:block}
.field{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.field label,.field .lab{font-size:13px;font-weight:700}
.field input[type=text],.field textarea,.field select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
.rng{display:grid;grid-template-columns:1fr 34px;gap:10px;align-items:center}
.rng output{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
input[type=range]{width:100%;accent-color:var(--me)}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.msg{font-size:13px;color:var(--muted);min-height:20px}
.msg.err{color:var(--s8)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.stat b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.chart{margin-top:12px;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:340px}
svg text{font-family:var(--font-body);font-size:13.5px;fill:var(--muted)}
svg .v{fill:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
svg .st{font-size:12px}
svg .w{fill:#fff;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend i.d{transform:rotate(45deg);border-radius:1px}
details.tb{margin-top:10px;font-size:12.5px}
details.tb summary{cursor:pointer;color:var(--muted)}
.tw{overflow-x:auto;margin-top:6px}
table{border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{border-bottom:1px solid var(--line);padding:4px 10px;text-align:left;white-space:nowrap}
.wall{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.note{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px}
.note small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.note.mine{border-color:var(--me)}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--soft);color:var(--muted);margin-right:6px}
.pacer{display:grid;place-items:center;min-height:210px;border-radius:12px;background:var(--bg);border:1px dashed var(--line);margin-top:12px;text-align:center;padding:16px}
.pacer .ball{width:84px;height:84px;border-radius:50%;background:color-mix(in srgb,var(--s3) 40%,var(--bg));border:2px solid var(--s3);transition:transform 4s ease-in-out}
.pacer .big{font-family:var(--font-display);font-size:22px;margin-top:10px}
.pacer .small{font-size:13px;color:var(--muted)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:6px;max-width:260px;opacity:0;transition:opacity .08s}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:60}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.how div{padding:14px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;color:var(--muted)}
.how b{display:block;color:var(--ink);margin-bottom:2px;font-size:14px}
.mx{overflow-x:auto}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:14px}
  nav.chs{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:6px;gap:6px}
  nav.chs button{display:flex;flex:none;gap:6px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
  nav.chs .sep{display:none}
  nav.chs .n{display:none}
  .ab{grid-template-columns:1fr}
  .chead h2{font-size:24px}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><b>브레인 크로스트레이닝</b><span>HR 성인 뇌훈련 프로그램 · 함께 참여하고 함께 보는 결과</span></div>
    <div class="tools">
      <span class="live" id="live"><span class="dot"></span><span id="liveTxt">연결 중</span></span>
      <input id="nick" type="text" maxlength="12" placeholder="닉네임" aria-label="닉네임">
      <input id="grp" type="text" maxlength="16" placeholder="그룹 코드 입력" aria-label="그룹 코드">
      <label class="demo"><input type="checkbox" id="demoCk"> 예시 데이터</label>
    </div>
  </header>
  <div id="banner"></div>
  <div class="shell">
    <nav class="chs" id="nav" aria-label="챕터"></nav>
    <main id="main"></main>
  </div>
</div>
<div id="tip" role="tooltip"></div>
<div id="toastBox"></div>

<script>
/* ---------- 기본 유틸 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const f1=n=>(Math.round(n*10)/10).toFixed(1);
const sum=a=>a.reduce((x,y)=>x+y,0);
const hash=s=>{let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0)/4294967296};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- 상태 ---------- */
/* 아티팩트 밖(GitHub Pages 등)에서 그룹 공유를 쓰려면 Firebase Realtime Database 주소를 넣으세요. 예: 'https://내프로젝트-default-rtdb.firebaseio.com' */
const CONFIG={firebaseUrl:''};
const gkOf=s=>String(s||'').trim().toLowerCase().replace(/[^a-z0-9가-힣_-]/g,'');
let backend=null,uid=null,others=[],dbError='',unsub=null;
let me={nick:store.get('bl_nick')||'',group:store.get('bl_grp')||'',gk:'',d:{},u:0};me.gk=gkOf(me.group);
let demoManual=null,tab=location.hash.replace('#','')||'home';
const useDemo=()=>demoManual!==null?demoManual:others.filter(o=>o.id!==uid&&me.gk&&o.gk===me.gk&&o.d&&Object.keys(o.d).length).length===0;

/* ---------- 교재 기반 상수 ---------- */
const EVENTS=['상사의 갑작스러운 피드백','마감 일정 변경','회의 중 내 의견에 반박','성과 평가 결과 통보','동료의 업무 누락','조직 개편 공지'];
const EMOS=['불안','분노','실망','기대','안도','무덤덤'];
const ACTS=['사실부터 확인한다','잠시 쉬고 온다','상대와 직접 대화한다','기록하고 내일 결정한다'];
const BLOCKERS=['평가받는 것에 대한 두려움','규칙·절차가 우선인 분위기','시간 압박','실패에 대한 불이익','과거 방식 답습','상사·위계에 대한 눈치','정답 중심의 학습 습관','회의에서 튀기 싫은 마음'];
const SITS=['발표·보고','평가 면담','새 프로젝트','갈등 대화','변화 통보'];
const STYLES=['시각형','청각형','체감형'];
const MI=['언어','논리수학','시각공간','신체운동','음악','대인관계','자기이해','자연탐구'];
const PERSP=['고객','신입사원','경영진','10년 후의 나','전혀 다른 업종'];
const AREAS=['업무','건강','가족','성장','관계','휴식'];
const TRAITS=['경험에 대한 개방성','스스로 평가하는 힘','개념을 갖고 노는 힘','심리적 안전','심리적 자유'];

const Q4=[['구체적이고 상세한 지시가 편하다','큰 방향만 주어지는 편이 편하다'],['자료를 분석한 뒤 결정한다','직감을 함께 참고해 결정한다'],['미리 계획표를 짜 둔다','흐름에 맞춰 그때그때 조정한다'],['새 도구는 설명서부터 읽는다','일단 만져 보며 익힌다'],['회의 메모는 번호와 개조식','회의 메모는 그림·화살표·낙서'],['사람은 이름이 먼저 기억난다','사람은 얼굴과 분위기가 먼저 기억난다'],['조건을 정리한 뒤 발상한다','연상과 비유로 먼저 발상한다'],['쉴 때는 퍼즐·계산이 즐겁다','쉴 때는 음악·그림이 즐겁다'],['선택할 때 비교표를 만든다','선택할 때 끌리는 쪽을 고른다'],['문제는 단계별로 푼다','문제는 전체 그림을 먼저 본다']];
const Q6=[['도표나 그림이 있어야 설명이 잘 이해된다',0],['길을 찾을 때 지도를 보는 편이 편하다',0],['메모에 도형·밑줄·색을 자주 쓴다',0],['사람의 표정이나 옷차림 변화를 잘 알아챈다',0],['듣는 것보다 읽는 것이 오래 남는다',0],
 ['설명은 말로 들을 때 더 잘 이해된다',1],['소리 내어 읽거나 혼잣말로 정리한다',1],['주변 소음이 작업에 신경 쓰인다',1],['메시지보다 통화가 편하다',1],['노래 가사나 멜로디를 쉽게 기억한다',1],
 ['직접 해 보며 배울 때 가장 빠르다',2],['오래 앉아 있기 힘들어 움직이며 생각한다',2],['말할 때 손짓이 많다',2],['걸으며 생각하면 정리가 잘 된다',2],['만들기·조립 같은 손작업이 편하다',2]];

function demoParts(){

    c5:()=>({ev:ri(0,5),emo:[0,0,1,2,2,3,4,5][ri(0,7)],int:ri(2,9),act:ri(0,3),t:'사실만 적은 한 문장'}),
    c6:()=>{const w=[.3+r()*.5,.3+r()*.5,.3+r()*.5];return {a:Q6.map(q=>r()<w[q[1]]?1:0)}},
    c7:()=>({a:Q7.map((_,j)=>Math.max(1,Math.min(5,ri(2,5)+(j>=10&&j<=13?0:r()<.3?-1:0))))}),
    c8:()=>{const b=ri(3,7);return {b,a:Math.min(10,b+ri(0,3))}},
    c9:()=>{const b=ri(4,9);return {b,a:Math.max(0,b-ri(1,4))}},
    c10:()=>({ideas:Array.from({length:ri(2,5)},()=>({t:pick(DEMO_IDEA),p:ri(0,4)}))}),
    c11:()=>({cur:AREAS.map(()=>ri(3,9)),ideal:AREAS.map(()=>ri(7,10))}),
    c12:()=>({a:TRAITS.map(()=>ri(2,5)),t:pick(DEMO_EXP)})};
    CH.forEach((c,j)=>{if(r()<prob[j])d[c.k]=G[c.k]()});
    out.push({id:'demo'+i,nick,group:i%2?'B반':'A반',d,demo:true});
  });

function radar(axes,series,max,label){

function go(t){tab=t;try{location.hash=t}catch(e){}renderNav();renderActivity();window.scrollTo({top:0})}
const myDoc=()=>({nick:me.nick||'',group:me.group||'',gk:me.gk||'',u:me.u||Date.now(),d:me.d});
async function persist(old){
  store.set('bl_nick',me.nick);store.set('bl_grp',me.group);
  if(!backend)return false;
  try{await backend.save(myDoc(),old);dbError='';renderChrome();return true}
  catch(e){dbError='저장하지 못했습니다. 이 링크가 보기 전용이면 응답을 제출할 수 없습니다. 진행자에게 참여 권한을 요청하세요.';renderChrome();return false}
}
function claudeBackend(db,u){return {kind:'claude',uid:u,
  async load(){const x=await db.doc('r/'+u).get();return x.exists?x.data():null},
  async save(doc){await db.doc('r/'+u).set(doc)},
  listen(gk,cb,err){return db.collection('r').where('gk','==',gk).onSnapshot(x=>cb(x.docs.map(d=>({id:d.id,...(d.data()||{})}))),err)}}}
function restBackend(){
  const base=CONFIG.firebaseUrl.replace(/\/$/,'');let id=store.get('bl_uid');
  if(!id){id='u'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);store.set('bl_uid',id)}
  return {kind:'rest',uid:id,
   async load(){try{return JSON.parse(store.get('bl_doc')||'null')}catch(e){return null}},
   async save(doc,old){store.set('bl_doc',JSON.stringify(doc));
     if(old&&old!==doc.gk)await fetch(`${base}/r/${old}/${id}.json`,{method:'DELETE'}).catch(()=>{});
     if(!doc.gk)return;
     const r=await fetch(`${base}/r/${doc.gk}/${id}.json`,{method:'PUT',body:JSON.stringify(doc)});if(!r.ok)throw new Error(r.status)},
   listen(gk,cb,err){let stop=false;const poll=async()=>{if(stop)return;try{const r=await fetch(`${base}/r/${gk}.json`);const j=(await r.json())||{};cb(Object.entries(j).map(([k,v])=>({id:k,...v})))}catch(e){if(err)err(e)}if(!stop)setTimeout(poll,3000)};poll();return()=>{stop=true}}};
}
function onData(){if(tab==='home')$('#main').innerHTML=`<div id="home">${homeHTML()}</div>`;else renderResults();renderNav();renderChrome()}
function subscribe(){
  if(unsub){try{unsub()}catch(e){}unsub=null}
  others=[];
  if(backend&&me.gk)unsub=backend.listen(me.gk,list=>{others=list;onData()},()=>{dbError='실시간 연결에 문제가 있습니다. 새로고침해 주세요.';renderChrome()});
  onData();
}

(async()=>{
